openapi: 3.0.1
info:
  title: API - mc3s-b2x-productcatalog
  description: |
    
    # Key Features 'mc3s-b2x-productcatalog'
    
    ## Category
    APIs to fetch getting category information 
    - Get category tree for store
    - get category details 
    - get category hierarchy 
    
    ## Product
    APIs to fetch product data 
    - Get product by ID
    - Get product by Key
    - Get product by Sku
    
    ## ProductInStore
    APIs to fetch product data for current store 
    - Get product by ID
    - Get product by Key
    - Get product by Sku
    
    ## Product Types
    APIs to fetch Product Type data 
    - Get Product Type by ID
    - Get Product Type by Key
    - Get Product Type Meta Data by ID
    - Get Product Type Meta Data by Key

    ## Listing
    APIs to fetch product listing information 
    
    - Product Listing for store by ID
    - Product Listing for store by Key
    - Product Listing for store by SKU
    - Product Listing for store by cart
    - Product Listing for store by order
    - Product Listing for store by shoppinglist
    
    ## AttributeGroup
    APIs to fetch Attribute Groups 
    
    - Get all Attribute Groups
    - Get Attribute Group by ID
    - Get Attribute Group by Key
    - Get Attribute Group for Product Type 

  version: 0-SNAPSHOT
servers:
  - url: https://productcatalog.dev.b2x.b2bx.mindcurv.io
    description: Generated server url
  - url: http://localhost:9101
    description: local
tags:
  - name: Catalog
    description: "Catalog related APIs"
  - name: Category
    description: "Category related APIs like fetching all or individual categories"
  - name: Product
    description: "APIs to fetch product details. Products can be fetched using *sku\
    \ id*, *product key* or  *product id*"
  - name: ProductInStore
    description: APIs to fetch product details in store
  - name: Product Types
    description: "APIs to fetch product type information."
  - name: Listing
    description: "APIs to fetch product listing information"
  - name: AttributeGroup
    description: "APIs to fetch product AttributeGroup information"
