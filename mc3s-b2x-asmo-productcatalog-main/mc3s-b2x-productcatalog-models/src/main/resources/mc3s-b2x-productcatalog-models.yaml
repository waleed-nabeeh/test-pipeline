      responses:
        404:
          description: Not found
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAggregation'
              examples:
                Product Aggregation:
                  summary: Product Aggregation
                  description: Product Aggregation
                  value:
                    categories:
                      - id: 77b0a692-87de-4e49-8143-c3ecb8f6f84a
                        typeId: category
                    description:
                      de: |-
                        Kohlenstoff (von urgerm. kul-a-, kul-ō(n)- ,Kohle‘) oder Carbon (von lat. carbō ,Holzkohle‘, latinisiert Carboneum oder Carbonium) ist ein chemisches Element mit dem Elementsymbol C und der Ordnungszahl 6. Im Periodensystem steht es in der vierten Hauptgruppe bzw. der 14. IUPAC-Gruppe oder Kohlenstoffgruppe sowie der zweiten Periode.

                        Es kommt in der Natur sowohl in gediegener (reiner) Form (Diamant, Graphit, Chaoit) als auch chemisch gebunden (z. B. in Form von Carbiden, Carbonaten, Kohlenstoffdioxid, Erdöl, Erdgas und Kohle) vor. Aufgrund seiner besonderen Elektronenkonfiguration (halbgefüllte L-Schale) besitzt es die Fähigkeit zur Bildung komplexer Moleküle und weist von allen chemischen Elementen die größte Vielfalt an chemischen Verbindungen auf. Diese Eigenschaft macht Kohlenstoff und seine Verbindungen zur Grundlage des Lebens auf der Erde.
                      en: |-
                        Carbon (from Latin: carbo) is a chemical element with the symbol C and atomic number 6. It is nonmetallic and tetravalent—making four electrons available to form covalent chemical bonds. It belongs to group 14 of the periodic table. Carbon makes up only about 0.025 percent of Earth's crust. Three isotopes occur naturally, 12C and 13C being stable, while 14C is a radionuclide, decaying with a half-life of about 5,730 years. Carbon is one of the few elements known since antiquity.

                        Carbon is the 15th most abundant element in the Earth's crust, and the fourth most abundant element in the universe by mass after hydrogen, helium, and oxygen. Carbon's abundance, its unique diversity of organic compounds, and its unusual ability to form polymers at the temperatures commonly encountered on Earth enables this element to serve as a common element of all known life. It is the second most abundant element in the human body by mass (about 18.5%) after oxygen.
                    id: 56286362-1843-4f50-9792-088057448a8c
                    key: pse-6
                    metaData:
                      description:
                        de: |-
                          Kohlenstoff (von urgerm. kul-a-, kul-ō(n)- ,Kohle‘) oder Carbon (von lat. carbō ,Holzkohle‘, latinisiert Carboneum oder Carbonium) ist ein chemisches Element mit dem Elementsymbol C und der Ordnungszahl 6. Im Periodensystem steht es in der vierten Hauptgruppe bzw. der 14. IUPAC-Gruppe oder Kohlenstoffgruppe sowie der zweiten Periode.

                          Es kommt in der Natur sowohl in gediegener (reiner) Form (Diamant, Graphit, Chaoit) als auch chemisch gebunden (z. B. in Form von Carbiden, Carbonaten, Kohlenstoffdioxid, Erdöl, Erdgas und Kohle) vor. Aufgrund seiner besonderen Elektronenkonfiguration (halbgefüllte L-Schale) besitzt es die Fähigkeit zur Bildung komplexer Moleküle und weist von allen chemischen Elementen die größte Vielfalt an chemischen Verbindungen auf. Diese Eigenschaft macht Kohlenstoff und seine Verbindungen zur Grundlage des Lebens auf der Erde.
                        en: |-
                          Carbon (from Latin: carbo) is a chemical element with the symbol C and atomic number 6. It is nonmetallic and tetravalent—making four electrons available to form covalent chemical bonds. It belongs to group 14 of the periodic table. Carbon makes up only about 0.025 percent of Earth's crust. Three isotopes occur naturally, 12C and 13C being stable, while 14C is a radionuclide, decaying with a half-life of about 5,730 years. Carbon is one of the few elements known since antiquity.

                          Carbon is the 15th most abundant element in the Earth's crust, and the fourth most abundant element in the universe by mass after hydrogen, helium, and oxygen. Carbon's abundance, its unique diversity of organic compounds, and its unusual ability to form polymers at the temperatures commonly encountered on Earth enables this element to serve as a common element of all known life. It is the second most abundant element in the human body by mass (about 18.5%) after oxygen.
