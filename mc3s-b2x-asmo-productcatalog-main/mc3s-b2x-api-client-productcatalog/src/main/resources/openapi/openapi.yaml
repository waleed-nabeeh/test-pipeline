openapi: 3.0.1
info:
  contact:
    email: info@mindcurv.com
    name: Mindcurv Group
    url: https://mindcurvgroup.com/en/services/digital-experiences-solutions/b2xaccelerator-for-composable-platforms-built-with-mach.html
  description: "mc3s-b2x-productcatalog REST API [build:2024-11-14T00:36:24.118Z]\n\
    \n# Header\nThe application accepts header parameters to control context\n\n|\
    \ Header             | Description     |\n| ------------------ | ---------------\
    \ |\n| Content-Language   | Active language |\n| X-Store            | Active store\
    \    |\n| X-Organization     | Active Unit     |\n| X-Company          | Active\
    \ Company  |\n| X-AnonymousId      | Anonymous Id    |\n\n\n---\n\n# Key Features\
    \ 'mc3s-b2x-productcatalog'\n\n## Category\nAPIs to fetch getting category information\
    \ \n- Get category tree for store\n- get category details \n- get category hierarchy\
    \ \n\n## Product\nAPIs to fetch product data \n- Get product by ID\n- Get product\
    \ by Key\n- Get product by Sku\n\n## ProductInStore\nAPIs to fetch product data\
    \ for current store \n- Get product by ID\n- Get product by Key\n- Get product\
    \ by Sku\n\n## Product Types\nAPIs to fetch Product Type data \n- Get Product\
    \ Type by ID\n- Get Product Type by Key\n- Get Product Type Meta Data by ID\n\
    - Get Product Type Meta Data by Key\n\n## Listing\nAPIs to fetch product listing\
    \ information \n\n- Product Listing for store by ID\n- Product Listing for store\
    \ by Key\n- Product Listing for store by SKU\n- Product Listing for store by cart\n\
    - Product Listing for store by order\n- Product Listing for store by shoppinglist\n\
    \n## AttributeGroup\nAPIs to fetch Attribute Groups \n\n- Get all Attribute Groups\n\
    - Get Attribute Group by ID\n- Get Attribute Group by Key\n- Get Attribute Group\
    \ for Product Type \n\n\n"
  title: API - mc3s-b2x-productcatalog
  version: 4.11.2877
externalDocs:
  description: Capabilities
  url: https://mindcurv.atlassian.net/wiki/spaces/MC3S/pages/6912410041
