  name: Product
- description: APIs to fetch product type information.
  name: Product Types
- description: APIs to fetch product details in store
  name: ProductInStore
- description: APIs to fetch product AttributeGroup information
  name: AttributeGroup
- description: Catalog related APIs
  name: Catalog
- description: APIs to fetch product listing information
  name: Listing
