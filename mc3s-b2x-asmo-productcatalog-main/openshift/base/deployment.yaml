apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc3s-b2x-aggregator-productcatalog
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      name: mc3s-b2x-aggregator-productcatalog
  template:
    metadata:
      labels:
        name: mc3s-b2x-aggregator-productcatalog
    spec:
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 5
      serviceAccountName: mc3s-b2x-aggregator-productcatalog
      containers:
        - name: mc3s-b2x-aggregator-productcatalog
          image: custom_image:base-tag
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: ct-secret
            - configMapRef:
                name: aggregator-config
          ports:
            - name: web
              containerPort: 2357
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: web
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: web
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: web
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
