default:
  tags:
    - asmo
  image: maven:3.9.12-eclipse-temurin-21
  before_script:
    - export HOME="$CI_PROJECT_DIR"
    - export MAVEN_USER_HOME="$CI_PROJECT_DIR/.m2"
    - mkdir -p "$MAVEN_USER_HOME/repository"
    - chmod +x mvnw
    - |
      if [ -n "$NEXUS_MAVEN_URL" ]; then
        cat > settings.xml <<SETTINGS
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
        <mirrors>
          <mirror>
            <id>nexus</id>
            <mirrorOf>external:*</mirrorOf>
            <url>${NEXUS_MAVEN_URL}</url>
          </mirror>
        </mirrors>
        <servers>
          <server>
            <id>nexus</id>
            <username>${NEXUS_USERNAME}</username>
            <password>${NEXUS_PASSWORD}</password>
          </server>
        </servers>
      </settings>
      SETTINGS
      else
        cat > settings.xml <<SETTINGS
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"/>
      SETTINGS
      fi

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "20"
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    --settings settings.xml
    -Dstyle.color=always
  APP_MODULE: "mc3s-app-aggregator-productcatalog"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  NEXUS_REGISTRY: "nexus.apps.asmonpeclr.np.asmo.com"
  IMAGE_NAME: "nexus.apps.asmonpeclr.np.asmo.com/marketplace/mc3s-b2x-asmo-productcatalog"
  JIB_FROM_IMAGE: "eclipse-temurin:21-jre"
  GITOPS_REPO_URL: "https://gitlab.apps.asmonpeclr.np.asmo.com/e-marketplace/kustomize-ocp.git"
  GITOPS_BRANCH: "main"
  GITOPS_KUSTOMIZATION: "productcatalog/overlays/dev/kustomization.yaml"
  MAVEN_FAST_BUILD_FLAGS: >-
    -Dmaven.test.skip=true
    -Dpmd.skip=true
    -Dcpd.skip=true
    -Ddependency-check.skip=true
    -Dpitest.skip=true

stages:
  - git_clone
  - pre_build
  - package
  - image
  - deploy

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - .m2/wrapper/

git_clone:
  stage: git_clone
  image: alpine:3.20
  script:
    - pwd
    - test -f pom.xml

unit_test:
  stage: pre_build
  rules:
    - when: manual
      allow_failure: true
  script:
    - ./mvnw $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
  allow_failure: true

build_maven:
  stage: package
  timeout: 30m
  script:
    - ./mvnw $MAVEN_CLI_OPTS -T 1C -pl "$APP_MODULE" -am clean package $MAVEN_FAST_BUILD_FLAGS
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"
    expire_in: 1 week
    paths:
      - "$APP_MODULE/target/*.jar"

build_image:
  stage: image
  needs:
    - job: build_maven
      artifacts: true
  script:
    - test -n "$NEXUS_USERNAME" || { echo "NEXUS_USERNAME is missing"; exit 1; }
    - test -n "$NEXUS_PASSWORD" || { echo "NEXUS_PASSWORD is missing"; exit 1; }
    - ./mvnw $MAVEN_CLI_OPTS -T 1C -pl "$APP_MODULE" -am install $MAVEN_FAST_BUILD_FLAGS
    - >
      ./mvnw $MAVEN_CLI_OPTS
      -pl "$APP_MODULE"
      jib:build
      $MAVEN_FAST_BUILD_FLAGS
      -Djib.from.image="$JIB_FROM_IMAGE"
      -Djib.to.image="$IMAGE_NAME:$IMAGE_TAG"
      -Djib.to.tags="$CI_COMMIT_REF_SLUG"
      -Djib.to.auth.username="$NEXUS_USERNAME"
      -Djib.to.auth.password="$NEXUS_PASSWORD"
      -Djib.allowInsecureRegistries=true

deploy_dev:
  stage: deploy
  image:
    name: alpine/git:v2.47.2
    entrypoint: [""]
  before_script: []
  needs:
    - job: build_image
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "ocp"'
    - if: '$CI_COMMIT_BRANCH'
      when: manual
  script:
    - test -n "$GITOPS_USERNAME" || { echo "GITOPS_USERNAME is missing"; exit 1; }
    - test -n "$GITOPS_ACCESS_TOKEN" || { echo "GITOPS_ACCESS_TOKEN is missing"; exit 1; }
    - AUTHENTICATED_GITOPS_URL="$(printf '%s' "$GITOPS_REPO_URL" | sed "s#https://#https://${GITOPS_USERNAME}:${GITOPS_ACCESS_TOKEN}@#")"
    - git clone --branch "$GITOPS_BRANCH" --single-branch "$AUTHENTICATED_GITOPS_URL" gitops
    - cd gitops
    - test -f "$GITOPS_KUSTOMIZATION"
    - |
      sed -i \
        "/newName: nexus.apps.asmonpeclr.np.asmo.com\/marketplace\/mc3s-b2x-asmo-productcatalog/{n;s/newTag:.*/newTag: ${IMAGE_TAG}/;}" \
        "$GITOPS_KUSTOMIZATION"
    - grep -A1 "newName: $IMAGE_NAME" "$GITOPS_KUSTOMIZATION"
    - git diff --check
    - |
      if git diff --quiet; then
        echo "Dev image tag is already $IMAGE_TAG"
        exit 0
      fi
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@asmo.local"
    - git add "$GITOPS_KUSTOMIZATION"
    - git commit -m "Deploy product catalog ${IMAGE_TAG} to dev"
    - git push origin "HEAD:$GITOPS_BRANCH"
