default:
  tags:
    - asmo
  image: maven:3.9.12-eclipse-temurin-21
  before_script:
    - export HOME="$CI_PROJECT_DIR"
    - export MAVEN_USER_HOME="$CI_PROJECT_DIR/.m2"
    - mkdir -p "$MAVEN_USER_HOME/repository"
    - chmod +x mvnw
    - |
      if [ -n "$NEXUS_MAVEN_URL" ]; then
        cat > settings.xml <<SETTINGS
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
        <mirrors>
          <mirror>
            <id>nexus</id>
            <mirrorOf>external:*</mirrorOf>
            <url>${NEXUS_MAVEN_URL}</url>
          </mirror>
        </mirrors>
        <servers>
          <server>
            <id>nexus</id>
            <username>${NEXUS_USERNAME}</username>
            <password>${NEXUS_PASSWORD}</password>
          </server>
        </servers>
      </settings>
      SETTINGS
      else
        cat > settings.xml <<SETTINGS
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"/>
      SETTINGS
      fi

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "20"
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    --settings settings.xml
    -Dstyle.color=always
  APP_MODULE: "mc3s-app-aggregator-productcatalog"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor:v1.23.2-debug"
  DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
  MAVEN_FAST_BUILD_FLAGS: >-
    -Dmaven.test.skip=true
    -Dpmd.skip=true
    -Dcpd.skip=true
    -Ddependency-check.skip=true
    -Dpitest.skip=true

stages:
  - git_clone
  - pre_build
  - package
  - image

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - .m2/wrapper/

git_clone:
  stage: git_clone
  image: alpine:3.20
  script:
    - pwd
    - test -f pom.xml

unit_test:
  stage: pre_build
  rules:
    - when: manual
      allow_failure: true
  script:
    - ./mvnw $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
  allow_failure: true

build_maven:
  stage: package
  timeout: 30m
  script:
    - ./mvnw $MAVEN_CLI_OPTS -T 1C -pl "$APP_MODULE" -am clean package $MAVEN_FAST_BUILD_FLAGS
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"
    expire_in: 1 week
    paths:
      - "$APP_MODULE/target/*.jar"

build_image:
  stage: image
  image:
    name: "$KANIKO_IMAGE"
    entrypoint: [""]
  before_script: []
  cache: []
  needs:
    - job: build_maven
      artifacts: true
  rules:
    - if: '$CI_REGISTRY_IMAGE && $GITLAB_REGISTRY_USERNAME && $GITLAB_REGISTRY_PASSWORD'
    - when: manual
      allow_failure: true
  script:
    - |
      set -- "$APP_MODULE"/target/*.jar
      test "$#" -eq 1
      test -f "$1"
    - mkdir -p "$DOCKER_CONFIG"
    - |
      REGISTRY_AUTH="$(printf '%s:%s' \
        "$GITLAB_REGISTRY_USERNAME" \
        "$GITLAB_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" "$REGISTRY_AUTH" > "$DOCKER_CONFIG/config.json"
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile.gitlab" \
        --destination "$IMAGE_NAME:$IMAGE_TAG" \
        --destination "$IMAGE_NAME:$CI_COMMIT_REF_SLUG" \
        --cache=true \
        --cache-repo "$IMAGE_NAME/cache" \
        --skip-tls-verify-registry "$CI_REGISTRY"
