apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: asmo-dev-kafka
  namespace: asmo-kafka-dev
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
      - name: external
        port: 9094
        type: route
        tls: true
        authentication:
          type: scram-sha-512
        configuration:
          brokerCertChainAndKey:
            secretName: asmo-kafka-external-cert
            certificate: tls.crt
            key: tls.key
          bootstrap:
            alternativeNames:
              - asmo-dev-kafka-kafka-bootstrap-asmo-kafka-dev.apps.asmonpeclr.np.asmo.com
          brokers:
            - broker: 0
              advertisedHost: asmo-dev-kafka-dual-role-0-asmo-kafka-dev.apps.asmonpeclr.np.asmo.com
              advertisedPort: 443
              alternativeNames:
                - asmo-dev-kafka-dual-role-0-asmo-kafka-dev.apps.asmonpeclr.np.asmo.com
            - broker: 1
              advertisedHost: asmo-dev-kafka-dual-role-1-asmo-kafka-dev.apps.asmonpeclr.np.asmo.com
              advertisedPort: 443
              alternativeNames:
                - asmo-dev-kafka-dual-role-1-asmo-kafka-dev.apps.asmonpeclr.np.asmo.com
            - broker: 2
              advertisedHost: asmo-dev-kafka-dual-role-2-asmo-kafka-dev.apps.asmonpeclr.np.asmo.com
              advertisedPort: 443
              alternativeNames:
                - asmo-dev-kafka-dual-role-2-asmo-kafka-dev.apps.asmonpeclr.np.asmo.com
    authorization:
      type: simple
    config:
      auto.create.topics.enable: "false"
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      num.partitions: 3
  entityOperator:
    topicOperator: {}
    userOperator: {}
