apiVersion: v1
kind: Pod
metadata:
  name: kafka-external-cert-smoke
  namespace: asmo-kafka-dev
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kafka-client
      image: docker.io/waleednabeeh/asmo-kafka-smoke:2026-09-18-2
      imagePullPolicy: Always
      command: ["bash", "-ec"]
      args:
        - |
          bash /opt/kafka/test-external-kafka-client.sh metadata
          echo 'PASS: TLS certificate and hostname validation, SCRAM authentication, and Kafka metadata retrieval succeeded'
          sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: user-secret
          mountPath: /opt/kafka/user
          readOnly: true
  volumes:
    - name: user-secret
      secret:
        secretName: asmo-app-client
